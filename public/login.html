<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<title>Elder Care Login</title>

<style>
body{
    font-family: 'DM Sans', sans-serif;
    background: #FAF7F2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* container */
.box{
    background: white;
    padding:35px;
    border-radius:20px;
    width:360px;
    box-shadow: 0 8px 32px rgba(45,58,46,0.1);
    border:1px solid #E2E8E3;
}

/* heading */
h1{
    text-align:center;
    font-family: 'DM Serif Display', serif;
    color:#2D3A2E;
    font-size:28px;
    margin-bottom:5px;
}

h2{
    text-align:center;
    color:#6B7A6C;
    font-size:14px;
    margin-bottom:20px;
}

/* welcome */
.welcome-msg{
    background:#EAF5EE;
    border-left:4px solid #4A7259;
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
    display:none;
}

/* inputs */
input, select{
    width:100%;
    padding:12px;
    margin-top:12px;
    border-radius:10px;
    border:1.5px solid #E2E8E3;
    font-size:14px;
    outline:none;
}

input:focus, select:focus{
    border-color:#7B9E87;
    box-shadow:0 0 0 3px rgba(123,158,135,0.15);
}

/* buttons */
button{
    width:100%;
    padding:12px;
    margin-top:12px;
    border-radius:10px;
    border:none;
    background: linear-gradient(135deg,#4A7259,#7B9E87);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(74,114,89,0.3);
}

/* toggle buttons */
.activeBtn{
    background: linear-gradient(135deg,#3A7D54,#7B9E87) !important;
}

/* visit */
.visit-counter{
    text-align:center;
    margin-top:10px;
    font-size:12px;
    color:#6B7A6C;
}
</style>
</head>

<body>

<div class="box">
    <h1>Elder Care</h1>
    <h2>Login Portal</h2>
    
    <div id="welcomeMsg" class="welcome-msg"></div>

    

    <!-- TOGGLE BUTTONS -->
<div style="display:flex; gap:10px;">
    <button id="loginBtn" onclick="showLogin()">Login</button>
    <button id="signupBtn" onclick="showSignup()">Sign Up</button>
</div>

<!-- LOGIN FORM -->
<div id="loginForm">
    <input type="text" id="loginName" placeholder="Enter Username">
    <input type="password" id="loginPass" placeholder="Enter Password">

    <button onclick="sendOTP()">Send OTP</button>

    <div id="otpSection" style="display:none;">
        <input type="text" id="otpInput" placeholder="Enter OTP">
        <button onclick="verifyOTP()">Verify OTP</button>
    </div>
</div>

<!-- SIGNUP FORM -->
<div id="signupForm" style="display:none;">
    <input type="text" id="signupName" placeholder="Enter Name">
    <input type="text" id="signupUsername" placeholder="Create Username">

    <select id="signupRole">
        <option value="caretaker">Caretaker</option>
        <option value="client">Client</option>
    </select>

    <input type="password" id="signupPass" placeholder="Create Password">
    <input type="password" id="confirmPass" placeholder="Confirm Password">

    <button onclick="signup()">Create Account</button>
</div>
    
    <div class="visit-counter" id="visitCounter"></div>
</div>

<script>

// -------- PAGE LOAD --------
window.onload = function(){
    initializeVisitTracking();
    showLogin(); // default
};

// -------- VISIT COUNTER --------
function initializeVisitTracking(){
    let visitCount = localStorage.getItem("visitCount");

    if(!visitCount){
        visitCount = 0;
    }

    visitCount = parseInt(visitCount) + 1;
    localStorage.setItem("visitCount", visitCount);

    let welcomeMsg = document.getElementById("welcomeMsg");
    welcomeMsg.style.display = "block";

    if(visitCount === 1){
        welcomeMsg.innerHTML = "🎉 Welcome!";
    } else {
        welcomeMsg.innerHTML = "👋 Welcome back!";
    }

    document.getElementById("visitCounter").innerHTML =
        `Total visits: <strong>${visitCount}</strong>`;
}

// -------- TOGGLE FUNCTIONS --------
function showLogin(){
    document.getElementById("loginForm").style.display = "block";
    document.getElementById("signupForm").style.display = "none";

    document.getElementById("loginBtn").classList.add("activeBtn");
    document.getElementById("signupBtn").classList.remove("activeBtn");
}

function showSignup(){
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("signupForm").style.display = "block";

    document.getElementById("signupBtn").classList.add("activeBtn");
    document.getElementById("loginBtn").classList.remove("activeBtn");
}

// -------- LOGIN --------
async function login(){
    let username = document.getElementById("loginName").value;
    let password = document.getElementById("loginPass").value;

    let res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username, password })
    });

    let data = await res.json();

    if(res.ok){
        localStorage.setItem("role", data.role);
        localStorage.setItem("userName", data.name);
        window.location.href="dashboard.html";
    } else {
        alert(data.message);
    }
    
}
let generatedOTP = null;
let tempUserData = null;

// STEP 1: verify credentials + generate OTP
async function sendOTP(){

    let username = document.getElementById("loginName").value;
    let password = document.getElementById("loginPass").value;

    let res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username, password })
    });

    let data = await res.json();

    if(res.ok){

        // store user temporarily
        tempUserData = data;

        // generate OTP
        generatedOTP = Math.floor(100000 + Math.random() * 900000);

        alert("Your OTP is: " + generatedOTP); // 🔥 simulate SMS

        document.getElementById("otpSection").style.display = "block";

    } else {
        alert(data.message);
    }
}

// STEP 2: verify OTP
function verifyOTP(){

    let userOTP = document.getElementById("otpInput").value;

    if(userOTP == generatedOTP){

        localStorage.setItem("role", tempUserData.role);
        localStorage.setItem("userName", tempUserData.name);

        alert("Login successful");

        window.location.href = "dashboard.html";

    } else {
        alert("Invalid OTP");
    }
}
// -------- SIGNUP --------
async function signup() {

    let name = document.getElementById("signupName").value;
    let username = document.getElementById("signupUsername").value;
    let password = document.getElementById("signupPass").value;
    let confirm = document.getElementById("confirmPass").value;
    let role = document.getElementById("signupRole").value;

    if (!name || !username || !password || !role) {
        alert("Please fill all fields");
        return;
    }

    if (password !== confirm) {
        alert("Passwords do not match");
        return;
    }

    let res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name,
            username,
            password,
            role
        })
    });

    let data = await res.json();

    alert(data.message);
    showLogin();
}
showLogin();

</script>

</body>
</html>
