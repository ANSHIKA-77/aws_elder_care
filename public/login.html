<!DOCTYPE html>
<html lang="en">

<head>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <title>Elder Care Login</title>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #FAF7F2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 20px;
            width: 360px;
            box-shadow: 0 8px 32px rgba(45, 58, 46, 0.1);
            border: 1px solid #E2E8E3;
        }

        h1 {
            text-align: center;
            font-family: 'DM Serif Display', serif;
            color: #2D3A2E;
            font-size: 28px;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            color: #6B7A6C;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .welcome-msg {
            background: #EAF5EE;
            border-left: 4px solid #4A7259;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 10px;
            border: 1.5px solid #E2E8E3;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus,
        select:focus {
            border-color: #7B9E87;
            box-shadow: 0 0 0 3px rgba(123, 158, 135, 0.15);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #4A7259, #7B9E87);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(74, 114, 89, 0.3);
        }

        .activeBtn {
            background: linear-gradient(135deg, #3A7D54, #7B9E87) !important;
        }

        .visit-counter {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #6B7A6C;
        }

        .error {
            color: #c0392b;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
        }

        .success {
            color: #4A7259;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Elder Care</h1>
        <h2>Login Portal</h2>

        <div id="welcomeMsg" class="welcome-msg"></div>

        <div style="display:flex; gap:10px;">
            <button id="loginBtn" onclick="showLogin()">Login</button>
            <button id="signupBtn" onclick="showSignup()">Sign Up</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="loginForm">
            <input type="email" id="loginEmail" placeholder="Enter Email">
            <input type="password" id="loginPass" placeholder="Enter Password">
            <button onclick="sendOTP()">Send OTP</button>

            <div id="otpSection" style="display:none;">
                <p class="success">OTP sent! Check your server terminal for the code.</p>
                <input type="text" id="otpInput" placeholder="Enter OTP (hint: 123456)">
                <button onclick="verifyOTP()">Verify OTP & Login</button>
            </div>
            <div id="loginMsg"></div>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupForm" style="display:none;">
            <input type="text" id="signupName" placeholder="Full Name">
            <input type="email" id="signupEmail" placeholder="Email Address">
            <select id="signupRole" onchange="toggleInviteField()">
                <option value="caretaker">Caregiver (Caretaker)</option>
                <option value="client">Client (Family Member)</option>
            </select>
            <!-- Only shown when role = client -->
            <div id="inviteCodeWrapper" style="display:none;">
                <input type="text" id="inviteCode" placeholder="Enter 6-character invite code from caretaker"
                    maxlength="6" style="text-transform:uppercase;">
            </div>
            <input type="password" id="signupPass" placeholder="Create Password">
            <input type="password" id="confirmPass" placeholder="Confirm Password">
            <button onclick="signup()">Create Account</button>
            <div id="signupMsg"></div>
        </div>

        <div class="visit-counter" id="visitCounter"></div>
    </div>

    <script src="/js/config.js"></script>
    <script>
        // -------- API BASE (reads from config.js) --------
        function apiBase() {
            return (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || '/api/v1';
        }

        // -------- PAGE LOAD --------
        window.onload = function () {
            initializeVisitTracking();
            showLogin();
        };

        // -------- VISIT COUNTER --------
        function initializeVisitTracking() {
            let count = parseInt(localStorage.getItem('visitCount') || '0') + 1;
            localStorage.setItem('visitCount', count);

            const msg = document.getElementById('welcomeMsg');
            msg.style.display = 'block';
            msg.innerHTML = count === 1 ? '🎉 Welcome!' : '👋 Welcome back!';
            document.getElementById('visitCounter').innerHTML = `Total visits: <strong>${count}</strong>`;
        }

        // -------- TOGGLE --------
        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('loginBtn').classList.add('activeBtn');
            document.getElementById('signupBtn').classList.remove('activeBtn');
        }

        function showSignup() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
            document.getElementById('signupBtn').classList.add('activeBtn');
            document.getElementById('loginBtn').classList.remove('activeBtn');
        }

        // -------- STEP 1: verify credentials + request OTP --------
        async function sendOTP() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value;
            const msgEl = document.getElementById('loginMsg');

            if (!email || !password) {
                msgEl.innerHTML = '<p class="error">Please enter email and password</p>';
                return;
            }

            // First verify credentials via login
            const loginRes = await fetch(`${apiBase()}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const loginData = await loginRes.json();

            if (!loginRes.ok) {
                msgEl.innerHTML = `<p class="error">${loginData.message || 'Invalid credentials'}</p>`;
                return;
            }

            // Credentials valid — now request OTP
            const otpRes = await fetch(`${apiBase()}/auth/send-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            if (otpRes.ok) {
                document.getElementById('otpSection').style.display = 'block';
                msgEl.innerHTML = '';
            } else {
                msgEl.innerHTML = '<p class="error">Failed to send OTP</p>';
            }
        }

        // -------- STEP 2: verify OTP --------
        async function verifyOTP() {
            const email = document.getElementById('loginEmail').value.trim();
            const otp = document.getElementById('otpInput').value.trim();
            const msgEl = document.getElementById('loginMsg');

            const res = await fetch(`${apiBase()}/auth/verify-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, otp })
            });

            const data = await res.json();

            if (res.ok) {
                // save token and user info
                localStorage.setItem('token', data.data.token);
                localStorage.setItem('role', data.data.user.role);
                localStorage.setItem('userName', data.data.user.name);
                window.location.href = 'home.html';
            } else {
                msgEl.innerHTML = `<p class="error">${data.message || 'Invalid OTP'}</p>`;
            }
        }

        // -------- SIGNUP --------
        function toggleInviteField() {
            const role = document.getElementById('signupRole').value;
            const wrapper = document.getElementById('inviteCodeWrapper');
            wrapper.style.display = role === 'client' ? 'block' : 'none';
        }

        async function signup() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPass').value;
            const confirm = document.getElementById('confirmPass').value;
            const role = document.getElementById('signupRole').value;
            const msgEl = document.getElementById('signupMsg');

            if (!name || !email || !password || !role) {
                msgEl.innerHTML = '<p class="error">Please fill all fields</p>';
                return;
            }

            if (password !== confirm) {
                msgEl.innerHTML = '<p class="error">Passwords do not match</p>';
                return;
            }

            // Build request body based on role
            let endpoint, body;

            if (role === 'caretaker') {
                endpoint = `${apiBase()}/auth/register/caretaker`;
                body = { name, email, password };
            } else {
                const inviteCode = document.getElementById('inviteCode').value.trim().toUpperCase();
                if (!inviteCode || inviteCode.length !== 6) {
                    msgEl.innerHTML = '<p class="error">Please enter the 6-character invite code from your caretaker</p>';
                    return;
                }
                endpoint = `${apiBase()}/auth/register/client`;
                body = { name, email, password, inviteCode };
            }

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await res.json();

            if (res.ok) {
                if (role === 'caretaker' && data.data && data.data.inviteCode) {
                    msgEl.innerHTML = `
                        <p class="success">Account created! Your invite code is:</p>
                        <p style="text-align:center; font-size:22px; font-weight:700; letter-spacing:4px; color:#4A7259; margin:8px 0;">${data.data.inviteCode}</p>
                        <p style="text-align:center; font-size:12px; color:#6B7A6C;">Share this code with family members so they can join your group.</p>
                    `;
                    setTimeout(showLogin, 4000);
                } else {
                    msgEl.innerHTML = '<p class="success">Account created! Please login.</p>';
                    setTimeout(showLogin, 1500);
                }
            } else {
                const errMsg = data.errors
                    ? data.errors.map(e => e.message).join(', ')
                    : data.message;
                msgEl.innerHTML = `<p class="error">${errMsg}</p>`;
            }
        }
    </script>
</body>

</html>
