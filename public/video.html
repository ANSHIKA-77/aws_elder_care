<!DOCTYPE html>
<html>

<head>
    <title>Video Call</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            /* This removes the scrollbars */
        }

        #video-header {
            height: 40px;
            line-height: 40px;
            background: #333;
            color: white;
            text-align: center;
        }

        #jitsi-container {
            /* This makes the video take up the whole screen minus the header */
            height: calc(100vh - 40px);
            width: 100%;
        }
    </style>
</head>

<body>

    <div id="video-header">
        <a href="javascript:void(0)" onclick="exitCall()" style="color:white;text-decoration:none;float:left;margin-left:16px;">← Exit Call</a>
        <span id="callHeaderTitle">📹 Family Video Call</span>
    </div>
    <div id="jitsi-container"></div>

    <script src="/js/config.js"></script>
    <script src="/js/shared.js"></script>
    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
        const role = getRole();
        const userName = getUserName() || (role === 'caretaker' ? 'Caretaker' : 'Client');
        const token = getToken();

        // Title based on role
        if (role === 'caretaker') {
            document.getElementById('callHeaderTitle').textContent = '📹 Video Call with Client';
        } else {
            document.getElementById('callHeaderTitle').textContent = '📹 Video Call with Caretaker';
        }

        // Get family groupId to create isolated family room
        let groupId = 'family-room';
        if (token) {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                if (payload.groupId) groupId = payload.groupId;
            } catch (e) {}
        }

        const roomName = 'ElderCare-' + groupId;

        // Signal incoming call to other family members
        apiCall('/video/call', {
            method: 'POST',
            body: JSON.stringify({ roomName })
        }).catch(err => console.error('Call signaling error:', err));

        function exitCall() {
            apiCall('/video/call/end', { method: 'POST' }).finally(() => {
                window.location.href = '/home.html';
            });
        }

        window.addEventListener('beforeunload', () => {
            const apiBase = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || '/api/v1';
            fetch(`${apiBase}/video/call/end`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                keepalive: true
            }).catch(() => {});
        });

        const options = {
            roomName: roomName,
            width: '100%',
            height: '100%',
            parentNode: document.querySelector('#jitsi-container'),
            userInfo: {
                displayName: userName
            },
            configOverwrite: {
                prejoinPageEnabled: false,
                enableWelcomePage: false,
                disableDeepLinking: true
            },
            interfaceConfigOverwrite: {
                TOOLBAR_BUTTONS: [
                    'microphone', 'camera', 'closedcaptions', 'desktop', 'fullscreen',
                    'fodeviceselection', 'hangup', 'profile', 'chat', 'recording',
                    'etherpad', 'sharedvideo', 'settings', 'raisehand',
                    'videoquality', 'filmstrip', 'invite', 'feedback', 'stats', 'shortcuts',
                    'tileview', 'videobackgroundblur', 'download', 'help', 'mute-everyone'
                ]
            }
        };

        const api = new JitsiMeetExternalAPI("meet.jit.si", options);

        api.addEventListeners({
            videoConferenceLeft: function () {
                exitCall();
            },
            readyToClose: function () {
                exitCall();
            }
        });
    </script>
</body>

</html>
