<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant — Elder Care</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/shared.css">
    <style>
        .voice-container {
            max-width: 600px;
            margin: 0 auto;
        }

        select,
        textarea {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .voice-button {
            width: 100%;
            padding: 16px;
            margin-top: 16px;
            background: linear-gradient(135deg, var(--sage-dark), var(--sage));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .voice-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 114, 89, 0.4);
        }

        .voice-button:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="container voice-container">
        <a href="/home.html" class="back-button">
            ← Back to Dashboard
        </a>

        <div class="page-header">
            <div>
                <h1>🎤 Voice Assistant</h1>
                <p>Speak commands to manage your care</p>
            </div>
        </div>

        <div class="section-card">
            <h2>Language Selection</h2>
            <select id="lang">
                <option value="en-US">English</option>
                <option value="hi-IN">Hindi</option>
                <option value="ta-IN">Tamil</option>
            </select>

            <h2 style="margin-top:24px;">Voice Input</h2>
            <textarea id="text" placeholder="Tap 'Speak' and say your command..."></textarea>

            <button class="voice-button" onclick="startListening()">🎙️ Start Speaking</button>
        </div>

        <div class="section-card">
            <h2>💡 Example Commands</h2>
            <div class="item">
                <strong>Medications:</strong><br>
                "BP tablet taken" or "Diabetes medicine taken"
            </div>
            <div class="item">
                <strong>Appointments:</strong><br>
                "Set appointment for doctor tomorrow at 3"
            </div>
            <div class="item">
                <strong>Exercises:</strong><br>
                "Mark exercise completed"
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="/js/config.js"></script>
    <script src="/js/shared.js"></script>
    <script>

        // 🎙️ SPEECH TO TEXT
        function startListening() {
            let lang = document.getElementById("lang").value;

            let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                showToast("Speech Recognition not supported in this browser", true);
                return;
            }

            let recognition = new SpeechRecognition();
            recognition.lang = lang;

            recognition.start();

            recognition.onresult = function (event) {
                let transcript = event.results[0][0].transcript.toLowerCase();

                console.log("VOICE:", transcript);

                document.getElementById("text").value = transcript;

                processCommand(transcript, lang);
            };

            recognition.onerror = function () {
                showToast("Error recognizing speech", true);
            };
        }


        // 🧠 MAIN COMMAND PROCESSOR
        async function processCommand(command, lang) {
            console.log("PROCESSING:", command);
            command = command.toLowerCase().trim();
            const currentRole = getRole();

            // 1. Action shortcuts
            if (command.includes("call caretaker") || command.includes("call client") || command.includes("call my child") || command.includes("call child") || command.includes("call mom") || command.includes("call parent") || command.includes("video call")) {
                speakResponse("Starting video call now", lang);
                showToast("📹 Opening video call...");
                setTimeout(() => { window.location.href = "video.html"; }, 1500);
                return;
            }

            if (command.includes("show my photos") || command.includes("show photos") || command.includes("open gallery") || command.includes("photos")) {
                speakResponse("Opening your family photo gallery", lang);
                showToast("🖼️ Opening gallery...");
                setTimeout(() => { window.location.href = "gallery.html"; }, 1500);
                return;
            }

            // 2. Questions about medications
            if (command.includes("what medicine") || command.includes("what medicines") || command.includes("what medication") || command.includes("did caretaker take") || command.includes("did mom take")) {
                try {
                    const res = await apiCall('/medications?activeOnly=true');
                    const meds = res.data || [];
                    if (meds.length === 0) {
                        speakResponse("There are no medications scheduled for today.", lang);
                        return;
                    }

                    if (command.includes("morning")) {
                        const morningMeds = meds.filter(m => m.timeOfDay === 'morning');
                        if (morningMeds.length === 0) {
                            speakResponse("You have no medications scheduled for this morning.", lang);
                            return;
                        }
                        const details = morningMeds.map(m => `${m.name}, ${m.takenToday ? 'already taken' : 'not taken yet'}`).join(". ");
                        speakResponse(`This morning you have ${morningMeds.length} medications: ${details}`, lang);
                        return;
                    }

                    // General status query
                    const taken = meds.filter(m => m.takenToday);
                    const pending = meds.filter(m => !m.takenToday);
                    const subject = currentRole === 'client' ? 'Caretaker' : 'You';
                    let answer = `${subject} have ${meds.length} medications today. ${taken.length} completed.`;
                    if (pending.length > 0) {
                        answer += ` Pending: ${pending.map(m => m.name).join(', ')}.`;
                    }
                    speakResponse(answer, lang);
                    return;
                } catch (e) {
                    speakResponse("Sorry, could not fetch medication details.", lang);
                    return;
                }
            }

            // 3. Questions about next appointment
            if (command.includes("when is my next appointment") || command.includes("next appointment") || command.includes("caretaker's appointment") || command.includes("when is mom's next appointment")) {
                try {
                    const res = await apiCall('/appointments');
                    const upcoming = (res.data || []).filter(a => a.status === 'upcoming');
                    if (upcoming.length === 0) {
                        speakResponse("There are no upcoming appointments scheduled.", lang);
                        return;
                    }
                    const next = upcoming[0];
                    const doc = next.doctor ? `Dr. ${next.doctor}` : next.title;
                    const dateStr = formatDate(next.date);
                    speakResponse(`The next appointment is with ${doc} on ${dateStr} at ${next.time} at ${next.hospital || next.location || 'the clinic'}.`, lang);
                    return;
                } catch (e) {
                    speakResponse("Could not retrieve appointments.", lang);
                    return;
                }
            }

            // 4. Questions about exercise completion
            if (command.includes("did i complete my exercise") || command.includes("did caretaker complete") || command.includes("did mom complete her exercise") || command.includes("exercise completed?")) {
                try {
                    const res = await apiCall('/exercises/log/today');
                    const log = res.data;
                    const sessions = log?.sessions || [];
                    if (sessions.length > 0) {
                        const lastSession = sessions[sessions.length - 1];
                        const timeStr = lastSession.completedAt ? new Date(lastSession.completedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'today';
                        let answer = `Yes, ${lastSession.category} of ${lastSession.duration || 20} minutes was completed at ${timeStr}.`;
                        if (lastSession.comment) answer += ` Note: ${lastSession.comment}`;
                        speakResponse(answer, lang);
                    } else {
                        const subject = currentRole === 'client' ? "Caretaker has not" : "You have not";
                        speakResponse(`${subject} completed today's exercise routine yet.`, lang);
                    }
                    return;
                } catch (e) {
                    speakResponse("Could not check exercise progress.", lang);
                    return;
                }
            }

            // Medication keywords — check FIRST before appointments
            let medKeywords = ["taken", "tablet", "tablets", "medicine", "medication", "दवा", "bp", "diabetes", "vitamin"];
            let isMedCommand = medKeywords.some(k => command.includes(k));

            // Appointment keywords
            let isApptCommand = (command.includes("appointment") || command.includes("अपॉइंटमेंट"))
                && !isMedCommand; // never treat med command as appointment

            // =========================
            // 💊 MEDICATION
            // =========================
            if (isMedCommand) {
                try {
                    // Get medications from backend
                    const response = await apiCall('/medications?activeOnly=true');
                    const meds = response.data || [];

                    if (meds.length === 0) {
                        speakResponse("No medications found", lang);
                        return;
                    }

                    let updated = false;
                    const toUpdate = [];

                    meds.forEach(m => {
                        let medName = m.name.toLowerCase();
                        let matchFound = false;

                        console.log("CHECKING MED:", medName, "| COMMAND:", command);

                        if (medName.includes("bp")) {
                            if (command.includes("bp") || command.includes("b p") ||
                                command.includes("blood pressure")) matchFound = true;
                        }
                        if (medName.includes("diabetes")) {
                            if (command.includes("diabetes") || command.includes("diabetic") ||
                                command.includes("sugar") || command.includes("diabet")) matchFound = true;
                        }
                        if (medName.includes("vitamin")) {
                            if (command.includes("vitamin") || command.includes("vitamins") ||
                                command.includes("vit ")) matchFound = true;
                        }

                        if (command.includes("morning") && medName.includes("morning")) matchFound = true;
                        if (command.includes("evening") && medName.includes("evening")) matchFound = true;
                        if (command.includes("all") || command.includes("every")) matchFound = true;

                        console.log("MATCH RESULT for", m.name, ":", matchFound);

                        if (matchFound && !m.takenToday) {
                            toUpdate.push(m._id);
                            updated = true;
                        }
                    });

                    // Update medications via API
                    if (updated) {
                        for (const medId of toUpdate) {
                            await apiCall(`/medications/${medId}/mark-taken`, { method: 'PATCH' });
                        }
                        speakResponse("Medication marked as taken", lang);
                        showToast("✅ Medication updated successfully");
                    } else {
                        speakResponse("Please say bp tablet, diabetes tablet, or vitamin", lang);
                    }
                } catch (error) {
                    console.error("Error updating medication:", error);
                    speakResponse("Failed to update medication", lang);
                    showToast("⚠ Failed to update medication", true);
                }
            }

            // =========================
            // 📅 APPOINTMENT
            // =========================
            else if (isApptCommand) {
                let title = extractTitle(command);
                let time = extractTime(command);
                let date = extractDate(command);

                if (!title || !time || !date) {
                    speakResponse("Could not understand appointment details", lang);
                    showToast("⚠ Please provide appointment title, date and time", true);
                    return;
                }

                try {
                    await apiCall('/appointments', {
                        method: 'POST',
                        body: JSON.stringify({
                            title: title,
                            date: date,
                            time: time,
                            location: "Voice Added",
                            notes: "Added via voice assistant"
                        })
                    });

                    speakResponse("Appointment added successfully", lang);
                    showToast("✅ Appointment created");
                } catch (error) {
                    console.error("Error adding appointment:", error);
                    speakResponse("Failed to add appointment", lang);
                    showToast("⚠ Failed to add appointment", true);
                }
            }

            // =========================
            // 🏃 EXERCISE
            // =========================
            else if (
                command.includes("exercise") ||
                command.includes("workout") ||
                command.includes("व्यायाम")
            ) {
                // Determine which exercise based on keywords
                let category = "Morning Stretching";  // default
                let steps = [
                    "Raise arms slowly 10 times",
                    "Neck rotation clockwise 5 times",
                    "Shoulder rolls 10 times"
                ];
                let duration = 10;

                // Check for specific exercise types
                if (command.includes("breathing") || command.includes("breath")) {
                    category = "Breathing Exercises";
                    steps = [
                        "Deep belly breathing 10 times",
                        "Alternate nostril breathing 5 rounds"
                    ];
                    duration = 5;
                }
                else if (command.includes("walk") || command.includes("walking")) {
                    category = "Walking Routine";
                    steps = [
                        "Light walking for 10 minutes"
                    ];
                    duration = 10;
                }
                else if (command.includes("balance")) {
                    category = "Balance Exercises";
                    steps = [
                        "Single leg stand 30 seconds"
                    ];
                    duration = 5;
                }
                else if (command.includes("physio") || command.includes("therapy")) {
                    category = "Physiotherapy";
                    steps = [
                        "Prescribed exercises completed"
                    ];
                    duration = 15;
                }
                else if (command.includes("stretch") || command.includes("morning")) {
                    category = "Morning Stretching";
                    steps = [
                        "Raise arms slowly 10 times",
                        "Neck rotation clockwise 5 times",
                        "Shoulder rolls 10 times"
                    ];
                    duration = 10;
                }

                try {
                    await apiCall('/exercises/log', {
                        method: 'POST',
                        body: JSON.stringify({
                            category,
                            steps,
                            duration
                        })
                    });

                    speakResponse(`${category} logged successfully`, lang);
                    showToast(`✅ ${category} logged`);
                } catch (error) {
                    console.error("Error logging exercise:", error);
                    speakResponse("Failed to log exercise", lang);
                    showToast("⚠ Failed to log exercise", true);
                }
            }

            // =========================
            // ❌ UNKNOWN
            // =========================
            else {
                speakResponse("Command not recognized. Try saying bp tablet taken or set appointment for doctor tomorrow at 3", lang);
                showToast("⚠ Command not understood", true);
            }
        }

        // 🔍 HELPERS
        function extractTitle(cmd) {
            let words = cmd.split("for");
            if (words.length > 1) {
                return words[1].split("at")[0].trim();
            }
            return "Voice Appointment";
        }

        function extractTime(cmd) {
            let match = cmd.match(/(\d{1,2})/);
            if (match) {
                return match[0].padStart(2, '0') + ":00";
            }
            return "10:00";
        }

        function extractDate(cmd) {
            let today = new Date();

            if (cmd.includes("tomorrow") || cmd.includes("कल")) {
                today.setDate(today.getDate() + 1);
            }

            return today.toISOString().split("T")[0];
        }


        // 🔊 RESPONSE
        function speakResponse(text, lang) {
            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = lang;
            window.speechSynthesis.speak(speech);
        }

    </script>

</body>

</html>
